name: validate-oci-free-stack

on:
  push:
    branches: [oci-free-deploy]
  pull_request:
    branches: [oci-free-deploy]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.3
      - name: Terraform format
        run: terraform fmt -check -recursive
      - name: Terraform init
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        run: terraform validate
      - name: Validate bootstrap shell syntax
        run: bash -n cloud-init.sh.tftpl
      - name: Validate pinned recovery prerequisites
        run: |
          grep -q 'apt-get install -y .* age ' cloud-init.sh.tftpl
          grep -q 'verified_infra_ref = "ebf42cc9acc872c64eab2584aaff0bd38e45e3ef"' compute.tf
