name: backend-stack
on:
  push:
    paths:
      - 'deploy/stack/**'
      - '.github/workflows/backend-stack.yml'
  pull_request:
    paths:
      - 'deploy/stack/**'
      - '.github/workflows/backend-stack.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate helper scripts
        working-directory: deploy/stack
        run: |
          sh -n init.sh
          sh -n verify.sh
          sh -n bootstrap-admin.sh
          sh -n backup.sh
          sh -n restore-drill.sh
          sh -n prepare-offsite-backup.sh
          sh -n update-pinned-release.sh
          sh -n operational-maintenance.sh
          python -m py_compile generate-alertmanager-config.py go-live-check.py check-release-pins.py
          python check-release-pins.py
          if sh update-pinned-release.sh main >/tmp/cw-update-invalid.out 2>&1; then
            echo 'release updater accepted a mutable branch name' >&2
            exit 1
          fi
          grep -q 'exact lowercase 40-character Git commit SHA' /tmp/cw-update-invalid.out
      - name: Create ephemeral CI environment
        working-directory: deploy/stack
        run: |
          cp .env.example .env
          sed -i 's|^CW_API_HOST=.*|CW_API_HOST=http://localhost|' .env
          sed -i "s|^CW_TOKEN_PEPPER=.*|CW_TOKEN_PEPPER=$(openssl rand -hex 32)|" .env
          sed -i "s|^CW_WORKSITES_TOKEN=.*|CW_WORKSITES_TOKEN=$(openssl rand -hex 32)|" .env
          chmod 600 .env
      - name: Validate Compose model
        working-directory: deploy/stack
        run: docker compose config >/tmp/crisisweave-compose.yml
      - name: Validate monitoring configuration
        working-directory: deploy/stack
        run: |
          docker compose pull prometheus alertmanager
          docker compose run --rm --no-deps --entrypoint /bin/promtool prometheus check config /etc/prometheus/prometheus.yml
          docker compose run --rm --no-deps --entrypoint /bin/promtool prometheus check rules /etc/prometheus/alerts.yml
          docker compose run --rm --no-deps --entrypoint /bin/amtool alertmanager check-config /etc/alertmanager/alertmanager.yml
      - name: Validate fail-closed production configuration gate
        working-directory: deploy/stack
        run: |
          cp .env /tmp/cw-dev.env
          sed -i 's|^CW_DEPLOYMENT_ENV=.*|CW_DEPLOYMENT_ENV=production|' .env
          sed -i 's|^CW_API_HOST=.*|CW_API_HOST=api.ci-crisisweave.dev|' .env
          sed -i 's|^CW_ALLOWED_ORIGIN=.*|CW_ALLOWED_ORIGIN=https://app.ci-crisisweave.dev|' .env
          sed -i 's|^CW_ALERTMANAGER_CONFIG=.*|CW_ALERTMANAGER_CONFIG=./alertmanager.generated.yml|' .env
          sed -i 's|^CW_ALERT_WEBHOOK_URL=.*|CW_ALERT_WEBHOOK_URL=https://hooks.ci-crisisweave.dev/alerts|' .env
          sed -i 's|^CW_BACKUP_AGE_RECIPIENT=.*|CW_BACKUP_AGE_RECIPIENT=age1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq|' .env
          sed -i 's|^CW_INCIDENT_RESPONSE_CONTACT=.*|CW_INCIDENT_RESPONSE_CONTACT=ci-on-call|' .env
          sed -i 's|^CW_PRIVACY_CONTACT=.*|CW_PRIVACY_CONTACT=ci-privacy|' .env
          sed -i 's|^CW_BACKUP_OWNER=.*|CW_BACKUP_OWNER=ci-recovery|' .env
          python generate-alertmanager-config.py
          python go-live-check.py --skip-dns | tee /tmp/cw-go-live.json
          python -c "import json; d=json.load(open('/tmp/cw-go-live.json')); assert d['ok'] and d['dns_checked'] is False"
          mv /tmp/cw-dev.env .env
          chmod 600 .env
      - name: Build application images
        working-directory: deploy/stack
        run: docker compose build worksites platform
      - name: Start full stack
        working-directory: deploy/stack
        run: |
          if ! docker compose up -d; then
            docker compose ps -a
            docker compose logs --no-color --tail=200 platform worksites caddy prometheus alertmanager blackbox || true
            exit 1
          fi
      - name: Verify stack
        working-directory: deploy/stack
        run: |
          trap 'docker compose logs --no-color --tail=200' ERR
          for i in $(seq 1 30); do
            if sh verify.sh; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Exercise operational maintenance dry-run
        working-directory: deploy/stack
        run: sh operational-maintenance.sh
      - name: Backup, restore drill and encrypted off-host bundle
        working-directory: deploy/stack
        run: |
          backup_dir="$(sh backup.sh /tmp/crisisweave-ci-backups)"
          test -n "$backup_dir"
          sh restore-drill.sh "$backup_dir"
          tampered=/tmp/crisisweave-ci-tampered
          rm -rf "$tampered"
          cp -a "$backup_dir" "$tampered"
          sed -i 's/^platform_commit=./platform_commit=0/' "$tampered/METADATA"
          if sh restore-drill.sh "$tampered" >/tmp/cw-tampered-restore.out 2>&1; then
            echo 'restore drill accepted tampered release metadata' >&2
            exit 1
          fi
          grep -q 'METADATA: FAILED' /tmp/cw-tampered-restore.out
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          age-keygen -o /tmp/crisisweave-age-key >/dev/null 2>&1
          export CW_BACKUP_AGE_RECIPIENT="$(age-keygen -y /tmp/crisisweave-age-key)"
          encrypted="$(sh prepare-offsite-backup.sh "$backup_dir" /tmp/crisisweave-offsite)"
          test -s "$encrypted"
          (cd "$(dirname "$encrypted")" && sha256sum -c "$(basename "$encrypted").sha256")
          age -d -i /tmp/crisisweave-age-key "$encrypted" | tar -tf - >/tmp/crisisweave-offsite-files
          for required in platform.sqlite3 private.sqlite3 worksites.sqlite3 AUDIT_SEALS.json SHA256SUMS METADATA; do
            grep -qx "$required" /tmp/crisisweave-offsite-files
          done
      - name: Tear down
        if: always()
        working-directory: deploy/stack
        run: docker compose down -v --remove-orphans
