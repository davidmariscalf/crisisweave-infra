name: backend-stack
on:
  push:
    paths:
      - 'deploy/stack/**'
      - '.github/workflows/backend-stack.yml'
  pull_request:
    paths:
      - 'deploy/stack/**'
      - '.github/workflows/backend-stack.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate helper scripts
        working-directory: deploy/stack
        run: |
          sh -n init.sh
          sh -n verify.sh
          sh -n bootstrap-admin.sh
      - name: Create ephemeral CI environment
        working-directory: deploy/stack
        run: |
          cp .env.example .env
          printf 'CW_API_HOST=http://localhost\n' >> .env
          printf 'CW_TOKEN_PEPPER=%s\n' "$(openssl rand -hex 32)" >> .env
          printf 'CW_WORKSITES_TOKEN=%s\n' "$(openssl rand -hex 32)" >> .env
          chmod 600 .env
      - name: Validate Compose model
        working-directory: deploy/stack
        run: docker compose config >/tmp/crisisweave-compose.yml
      - name: Build application images
        working-directory: deploy/stack
        run: docker compose build worksites platform
      - name: Start full stack
        working-directory: deploy/stack
        run: |
          if ! docker compose up -d; then
            docker compose ps -a
            docker compose logs --no-color --tail=200 platform worksites caddy prometheus blackbox || true
            exit 1
          fi
      - name: Verify stack
        working-directory: deploy/stack
        run: |
          trap 'docker compose logs --no-color --tail=200' ERR
          for i in $(seq 1 30); do
            if sh verify.sh; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Tear down
        if: always()
        working-directory: deploy/stack
        run: docker compose down -v --remove-orphans
