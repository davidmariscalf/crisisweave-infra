name: infra-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Reject committed secrets
        run: python scripts/check-secrets.py

      - name: Validate required files
        run: |
          test -f site/index.html
          test -f site/404.html
          test -f site/_headers
          test -f site/_redirects
          test -f site/health.json
          test -f site/robots.txt
          test -f site/sitemap.xml
          test -f site/security.txt
          test -f site/.well-known/security.txt
          test -f site/volunteer-demo.html
          test -f site/volunteer-demo.js
          test -f site/coordinator-demo.html
          test -f site/coordinator-demo.js
          test -f netlify.toml
          test -f .env.example
          test -f ecosystem/components.lock.json
          test -f ecosystem/README.md
          test -f deploy/identity/README.md
          test -f deploy/identity/oauth2-proxy.env.example
          test -f deploy/secrets/README.md
          test -f deploy/dr/README.md
          test -f deploy/dr/litestream.yml.example
          test -f deploy/edge/README.md
          test -f deploy/edge/Caddyfile.example
          test -f deploy/observability/README.md
          test -f deploy/observability/blackbox.yml.example
          test -f deploy/observability/prometheus.yml.example
          test -f deploy/stack/compose.yaml
          test -f deploy/stack/alerts.yml
          test -f deploy/stack/backup.sh
          test -f deploy/stack/restore-drill.sh

      - name: Validate public health document
        run: python -c 'import json; d=json.load(open("site/health.json")); assert d["status"]=="ok" and d["synthetic_demo_only"] is True'

      - name: Validate external component lock
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('ecosystem/components.lock.json').read_text())
          assert d['schema_version']==1
          rows={x['repository']:x for x in d['components']}
          expected={
            'goauthentik/authentik':('2026.8.2','recommended_not_deployed'),
            'oauth2-proxy/oauth2-proxy':('7.15.4','recommended_not_deployed'),
            'caddyserver/caddy':('2.11.4','recommended_not_deployed'),
            'openbao/openbao':('2.6.2','recommended_not_deployed'),
            'benbjohnson/litestream':('0.5.17','recommended_not_deployed'),
            'restic/restic':('0.19.1','recommended_not_deployed'),
            'prometheus/prometheus':('3.14.0','recommended_not_deployed'),
            'prometheus/blackbox_exporter':('0.28.0','recommended_not_deployed'),
            'rqlite/rqlite':('10.3.3','evaluated_not_adopted'),
            'CrisisCleanup/crisiscleanup-4-web':('master','adapter_only_no_live_credentials'),
          }
          assert set(rows)==set(expected)
          for repo,(version,status) in expected.items():
              assert rows[repo]['version']==version
              assert rows[repo]['status']==status
          PY

      - name: Validate secret-free deployment templates
        run: |
          python - <<'PY'
          from pathlib import Path
          identity=Path('deploy/identity/oauth2-proxy.env.example').read_text()
          assert 'OAUTH2_PROXY_CLIENT_SECRET=\n' in identity
          assert 'OAUTH2_PROXY_COOKIE_SECRET=\n' in identity
          dr=Path('deploy/dr/litestream.yml.example').read_text()
          for marker in ('<PLATFORM_REPLICA_URL>','<PRIVATE_REPLICA_URL>','<WORKSITES_REPLICA_URL>'):
              assert marker in dr
          caddy=Path('deploy/edge/Caddyfile.example').read_text()
          assert 'reverse_proxy crisisweave-platform:8080' in caddy
          assert 'api.example.org' in caddy
          prom=Path('deploy/observability/prometheus.yml.example').read_text()
          assert 'crisisweave-platform:8080' in prom
          assert 'blackbox-exporter:9115' in prom
          PY

      - name: Validate stack hardening invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          compose=Path('deploy/stack/compose.yaml').read_text()
          for required in (
              'CW_TRUST_PROXY: "1"',
              'pids_limit:',
              'mem_limit:',
              'max-size: "10m"',
              './alerts.yml:/etc/prometheus/alerts.yml:ro',
              'internal: true',
          ):
              assert required in compose, required
          assert 'worksites:' in compose and 'platform:' in compose
          alerts=Path('deploy/stack/alerts.yml').read_text()
          for alert in (
              'CrisisWeavePlatformDatabaseUnhealthy',
              'CrisisWeaveWorksitesUnavailable',
              'CrisisWeaveDataVolumeLow',
              'CrisisWeaveServerErrorsHigh',
              'CrisisWeaveEdgeReadinessDown',
          ):
              assert alert in alerts, alert
          backup=Path('deploy/stack/backup.sh').read_text()
          assert 'PRAGMA integrity_check' in backup
          assert 'sha256sum' in backup
          drill=Path('deploy/stack/restore-drill.sh').read_text()
          assert 'mode=ro' in drill
          assert 'live data was not modified' in drill
          PY

      - name: Verify no credential material in public site
        run: |
          ! grep -RniE 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|Bearer [A-Za-z0-9._-]{20,}|sk[-_][A-Za-z0-9_-]{20,}' site

      - name: Validate public demo safety invariants
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for name in ('volunteer-demo.html','coordinator-demo.html'):
              text=(Path('site')/name).read_text(encoding='utf-8')
              assert 'synthetic' in text.lower(), name
              assert not re.search(r'<script(?![^>]*\bsrc=)[^>]*>', text, re.I), f'inline script in {name}'
              lower=text.lower()
              for forbidden in ('survivor_name','phone_number','exact_address','government_id','social security'):
                  assert forbidden not in lower, f'{forbidden} in {name}'
          volunteer=(Path('site')/'volunteer-demo.html').read_text(encoding='utf-8').lower()
          coordinator=(Path('site')/'coordinator-demo.html').read_text(encoding='utf-8').lower()
          assert 'not permission to enter' in volunteer
          assert 'incident intelligence shown here does not create a volunteer cleanup job' in coordinator
          assert 'claim' not in volunteer
          redirects=(Path('site')/'_redirects').read_text(encoding='utf-8')
          assert '/.well-known/security.txt /security.txt 200' in redirects
          headers=(Path('site')/'_headers').read_text(encoding='utf-8').lower()
          assert 'content-security-policy:' in headers
          assert "default-src 'self'" in headers
          PY
