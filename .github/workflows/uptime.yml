name: public-uptime
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: crisisweave-public-uptime
  cancel-in-progress: true
jobs:
  check-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check homepage content
        run: |
          curl --fail --silent --show-error --location --max-time 20 https://crisisweave.netlify.app/ | grep -q '<title>CrisisWeave</title>'

      - name: Check health metadata
        run: |
          curl --fail --silent --show-error --location --max-time 20 https://crisisweave.netlify.app/health.json | python -c 'import json,sys; d=json.load(sys.stdin); assert d["status"]=="ok" and d["synthetic_demo_only"] is True'

      - name: Check security contact
        run: |
          body="$(curl --fail --silent --show-error --location --max-time 20 https://crisisweave.netlify.app/.well-known/security.txt)"
          printf '%s' "$body" | grep -q '^Contact: mailto:'
          printf '%s' "$body" | grep -q '^Policy: https://github.com/davidmariscalf/crisisweave-platform/blob/main/SECURITY.md$'

      - name: Check security headers
        run: |
          headers="$(curl --fail --silent --show-error --head --max-time 20 https://crisisweave.netlify.app/)"
          printf '%s\n' "$headers" | grep -qi '^x-content-type-options: nosniff'
          printf '%s\n' "$headers" | grep -qi '^x-frame-options: DENY'
          printf '%s\n' "$headers" | grep -qi '^referrer-policy: strict-origin-when-cross-origin'
          printf '%s\n' "$headers" | grep -qi '^content-security-policy:'
          printf '%s\n' "$headers" | grep -qi '^strict-transport-security:'

      - name: Check GitHub redirect rule
        run: |
          headers="$(curl --silent --show-error --head --max-time 20 https://crisisweave.netlify.app/github)"
          printf '%s\n' "$headers" | grep -Eq '^HTTP/[^ ]+ 30[1278]'
          printf '%s\n' "$headers" | grep -qi '^location: https://github.com/davidmariscalf/CrisisWeave'
