name: crisisweave

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  worksites:
    build:
      context: ${CW_WORKSITES_GIT_CONTEXT:-https://github.com/davidmariscalf/crisisweave-worksites.git#cd8e4c99602fea231b7b9209f2f2a0139645f93e}
    restart: unless-stopped
    init: true
    environment:
      CW_COORDINATOR_TOKEN: ${CW_WORKSITES_TOKEN:?CW_WORKSITES_TOKEN must be set in the local .env file}
      CW_MAX_HTTP_WORKERS: ${CW_WORKSITES_HTTP_WORKERS:-32}
      CW_HTTP_SOCKET_TIMEOUT: ${CW_HTTP_SOCKET_TIMEOUT:-10}
    volumes:
      - worksites_data:/data
    networks:
      - app_internal
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8787/api/health',timeout=2); d=json.load(r); assert r.status==200 and d.get('ok')"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: ${CW_WORKSITES_MEMORY_LIMIT:-512m}
    logging: *json-logging

  platform:
    build:
      context: ${CW_PLATFORM_GIT_CONTEXT:-https://github.com/davidmariscalf/crisisweave-platform.git#9e7aa0d2aaaf2ecb36688e1632e50da4c1218563}
    restart: unless-stopped
    init: true
    depends_on:
      worksites:
        condition: service_healthy
    environment:
      CW_TOKEN_PEPPER: ${CW_TOKEN_PEPPER:?CW_TOKEN_PEPPER must be set in the local .env file}
      CW_WORKSITES_TOKEN: ${CW_WORKSITES_TOKEN:?CW_WORKSITES_TOKEN must be set in the local .env file}
      CW_DB: /data/platform.db
      CW_PRIVATE_DB: /data/private.db
      CW_WORKSITES_URL: http://worksites:8787
      CW_HOST: 0.0.0.0
      CW_PORT: 8080
      CW_RATE_LIMIT_PER_MINUTE: ${CW_RATE_LIMIT_PER_MINUTE:-120}
      CW_ALLOWED_ORIGIN: ${CW_ALLOWED_ORIGIN:-https://crisisweave.netlify.app}
      CW_TRUST_PROXY: "1"
      CW_MAX_HTTP_WORKERS: ${CW_PLATFORM_HTTP_WORKERS:-64}
      CW_HTTP_SOCKET_TIMEOUT: ${CW_HTTP_SOCKET_TIMEOUT:-10}
    volumes:
      - platform_data:/data
    networks:
      - app_internal
      - monitoring_internal
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8080/readyz',timeout=2); d=json.load(r); assert r.status==200 and d.get('ok')"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 160
    mem_limit: ${CW_PLATFORM_MEMORY_LIMIT:-768m}
    logging: *json-logging

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    init: true
    depends_on:
      platform:
        condition: service_healthy
    environment:
      CW_API_HOST: ${CW_API_HOST:?Set CW_API_HOST in .env, for example api.example.org}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app_internal
      - monitoring_internal
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/run:size=8m,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    mem_limit: ${CW_CADDY_MEMORY_LIMIT:-256m}
    logging: *json-logging

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    init: true
    depends_on:
      platform:
        condition: service_healthy
      blackbox:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${CW_PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring_internal
    ports:
      - "127.0.0.1:${CW_PROMETHEUS_PORT:-9090}:9090"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: ${CW_PROMETHEUS_MEMORY_LIMIT:-1g}
    logging: *json-logging

  blackbox:
    image: prom/blackbox-exporter:v0.28.0
    restart: unless-stopped
    init: true
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - monitoring_internal
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 96
    mem_limit: ${CW_BLACKBOX_MEMORY_LIMIT:-256m}
    logging: *json-logging

volumes:
  worksites_data:
  platform_data:
  caddy_data:
  caddy_config:
  prometheus_data:

networks:
  app_internal:
    internal: true
  monitoring_internal:
    internal: true
  edge:
